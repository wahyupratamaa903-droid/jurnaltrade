<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jurnal Trading Spreadsheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .sheet-table th { background: #111827; border: 1px solid #1f2937; position: sticky; top: 0; z-index: 10; }
    .sheet-table td { border: 1px solid #1f2937; white-space: nowrap; }
    .sheet-table tr:hover { background: rgba(31, 41, 55, 0.4); }
  </style>
</head>
<body class="text-slate-200 text-xs min-h-screen p-2 md:p-4">

  <!-- Top Metrics Bar -->
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 mb-3 flex flex-wrap items-center justify-between gap-3 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm">
        <i class="fas fa-table-cells"></i>
      </div>
      <div>
        <h1 class="font-black text-sm text-slate-100 uppercase tracking-wide">Jurnal Trading Sheet</h1>
        <p class="text-[10px] text-slate-400">Manual Entry • Auto Balance Calculation</p>
      </div>
    </div>

    <!-- Live Stat Summary -->
    <div class="flex flex-wrap items-center gap-4 text-xs font-mono">
      <div>
        <span class="text-slate-500 text-[10px] block">MODAL AWAL</span>
        <input type="number" id="initial-balance" value="2000000" onchange="updateCalculations()" class="bg-slate-950 border border-slate-700 rounded px-2 py-0.5 text-xs text-amber-400 font-bold w-28 focus:outline-none">
      </div>
      <div>
        <span class="text-slate-500 text-[10px] block">EQUITY SAAT INI</span>
        <span id="current-equity" class="font-black text-slate-100">Rp 2.000.000</span>
      </div>
      <div>
        <span class="text-slate-500 text-[10px] block">CAPITAL GAIN</span>
        <span id="capital-gain" class="font-black text-emerald-400">0.00%</span>
      </div>
      <div>
        <span class="text-slate-500 text-[10px] block">WIN RATE</span>
        <span id="win-rate" class="font-black text-blue-400">0%</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-2">
      <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
        <i class="fas fa-plus"></i> Tambah Posisi
      </button>
      <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
        <i class="fas fa-file-csv"></i> Unduh CSV
      </button>
    </div>
  </div>

  <!-- Spreadsheet Table Container -->
  <div class="bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
    <div class="overflow-x-auto max-h-[78vh]">
      <table class="sheet-table w-full text-left border-collapse font-mono text-[11px]">
        <thead>
          <tr class="text-[10px] text-slate-400 uppercase tracking-wider">
            <th class="p-2 text-center w-8">#</th>
            <th class="p-2">TANGGAL</th>
            <th class="p-2 text-center">POSISI</th>
            <th class="p-2 text-right">LOT</th>
            <th class="p-2">INSTRUMEN</th>
            <th class="p-2 text-center">R:R</th>
            <th class="p-2 text-right">RISK</th>
            <th class="p-2 text-center">STATUS</th>
            <th class="p-2 text-right">PROFIT</th>
            <th class="p-2 text-right">LOSS</th>
            <th class="p-2 text-right">PIPS</th>
            <th class="p-2 min-w-[200px]">REASON (ANALISA)</th>
            <th class="p-2 min-w-[200px]">INFORMATION (PSIKOLOGI)</th>
            <th class="p-2 text-right">EQUITY</th>
            <th class="p-2 text-center">DOC</th>
            <th class="p-2 text-center">AKSI</th>
          </tr>
        </thead>
        <tbody id="sheet-body" class="divide-y divide-slate-800">
          <!-- Diisi otomatis oleh JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Input Form -->
  <div id="entry-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-3 z-50">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-black text-sm text-slate-100 flex items-center gap-2">
          <i class="fas fa-pen-to-square text-emerald-400"></i> Catat Transaksi Baru
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-100 text-base"><i class="fas fa-times"></i></button>
      </div>

      <form id="trade-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Tanggal</label>
            <input type="text" id="m-date" placeholder="Contoh: 30/7/26" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Instrumen / Pair</label>
            <input type="text" id="m-pair" placeholder="XAUUSD" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 uppercase font-bold">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Posisi</label>
            <select id="m-side" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 font-bold">
              <option value="BUY">BUY</option>
              <option value="SELL">SELL</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Lot Size</label>
            <input type="text" id="m-lot" placeholder="0.01" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 font-mono">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">R:R</label>
            <input type="text" id="m-rr" placeholder="1:3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Hasil (Status)</label>
            <select id="m-status" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 font-bold">
              <option value="TP">TP (Take Profit)</option>
              <option value="SL">SL (Stop Loss)</option>
              <option value="SL+">SL+</option>
              <option value="BE">BE (Break Even)</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Nominal (Rp)</label>
            <input type="number" id="m-nominal" placeholder="Contoh: 150000" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 font-mono font-bold">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Pips</label>
            <input type="number" step="0.1" id="m-pips" placeholder="26.5" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 font-mono">
          </div>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Risk Plan (Rp)</label>
          <input type="number" id="m-risk" placeholder="Contoh: 100000" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 font-mono">
        </div>

        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Reason (Alasan Analisa / Setup)</label>
          <textarea id="m-reason" rows="2" placeholder="Entry setelah area liquidity sweep pada sesi London..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200"></textarea>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Information (Psikologi / Kondisi Eksekusi)</label>
          <textarea id="m-info" rows="2" placeholder="Tenang dan percaya diri karena sudah sesuai trading plan..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200"></textarea>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 block mb-1">Link Dokumentasi / Screenshot (Opsional)</label>
          <input type="url" id="m-doc" placeholder="https://..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200">
        </div>

        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-white transition text-xs mt-2">
          Simpan ke Sheet
        </button>
      </form>
    </div>
  </div>

  <script>
    const STORE_KEY = 'sheet_trading_data_v2';
    const BALANCE_KEY = 'sheet_trading_init_bal';

    let trades = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    let initialBalance = parseFloat(localStorage.getItem(BALANCE_KEY) || '2000000');

    document.getElementById('initial-balance').value = initialBalance;

    function saveToStorage() {
      localStorage.setItem(STORE_KEY, JSON.stringify(trades));
      localStorage.setItem(BALANCE_KEY, initialBalance.toString());
      updateCalculations();
      renderSheet();
    }

    function openModal() {
      document.getElementById('entry-modal').classList.remove('hidden');
      document.getElementById('entry-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('entry-modal').classList.add('hidden');
      document.getElementById('entry-modal').classList.remove('flex');
      document.getElementById('trade-form').reset();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const status = document.getElementById('m-status').value;
      const nominal = parseFloat(document.getElementById('m-nominal').value) || 0;

      let profit = 0;
      let loss = 0;

      if (status === 'TP' || status === 'SL+') {
        profit = nominal;
      } else if (status === 'SL') {
        loss = nominal;
      }

      const item = {
        id: Date.now(),
        date: document.getElementById('m-date').value,
        pair: document.getElementById('m-pair').value.toUpperCase(),
        side: document.getElementById('m-side').value,
        lot: document.getElementById('m-lot').value,
        rr: document.getElementById('m-rr').value || '-',
        risk: parseFloat(document.getElementById('m-risk').value) || 0,
        status: status,
        profit: profit,
        loss: loss,
        pips: document.getElementById('m-pips').value || '-',
        reason: document.getElementById('m-reason').value || '-',
        info: document.getElementById('m-info').value || '-',
        doc: document.getElementById('m-doc').value || ''
      };

      trades.push(item);
      saveToStorage();
      closeModal();
    }

    function deleteRow(id) {
      if (confirm('Hapus baris transaksi ini?')) {
        trades = trades.filter(t => t.id !== id);
        saveToStorage();
      }
    }

    function updateCalculations() {
      initialBalance = parseFloat(document.getElementById('initial-balance').value) || 0;
      localStorage.setItem(BALANCE_KEY, initialBalance.toString());

      let running = initialBalance;
      let wins = 0;

      trades.forEach(t => {
        if (t.status === 'TP' || t.status === 'SL+') wins++;
        running += (t.profit - t.loss);
        t.calculatedEquity = running;
      });

      const totalTrades = trades.length;
      const winRate = totalTrades > 0 ? ((wins / totalTrades) * 100).toFixed(1) : 0;
      const gain = initialBalance > 0 ? (((running - initialBalance) / initialBalance) * 100).toFixed(2) : 0;

      document.getElementById('current-equity').textContent = `Rp ${running.toLocaleString('id-ID')}`;
      document.getElementById('capital-gain').textContent = `${gain >= 0 ? '+' : ''}${gain}%`;
      document.getElementById('capital-gain').className = `font-black ${gain >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
      document.getElementById('win-rate').textContent = `${winRate}%`;
    }

    function renderSheet() {
      const tbody = document.getElementById('sheet-body');
      if (trades.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="16" class="p-8 text-center text-slate-500 font-sans">
              Belum ada data transaksi. Klik tombol "+ Tambah Posisi" di atas.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = trades.map((t, idx) => {
        const sideBadge = t.side === 'BUY' 
          ? '<span class="bg-emerald-950/80 text-emerald-400 border border-emerald-800 px-1.5 py-0.5 rounded text-[9px] font-bold">BUY</span>'
          : '<span class="bg-rose-950/80 text-rose-400 border border-rose-800 px-1.5 py-0.5 rounded text-[9px] font-bold">SELL</span>';

        let statusBadge = '';
        if (t.status === 'TP') statusBadge = '<span class="bg-emerald-600 text-slate-950 font-black px-2 py-0.5 rounded text-[9px]">TP</span>';
        else if (t.status === 'SL') statusBadge = '<span class="bg-rose-600 text-white font-black px-2 py-0.5 rounded text-[9px]">SL</span>';
        else if (t.status === 'SL+') statusBadge = '<span class="bg-yellow-500 text-slate-950 font-black px-1.5 py-0.5 rounded text-[9px]">SL+</span>';
        else statusBadge = '<span class="bg-slate-700 text-slate-300 font-bold px-1.5 py-0.5 rounded text-[9px]">BE</span>';

        return `
          <tr>
            <td class="p-2 text-center text-slate-500">${idx + 1}</td>
            <td class="p-2 font-medium text-slate-300">${t.date}</td>
            <td class="p-2 text-center">${sideBadge}</td>
            <td class="p-2 text-right text-slate-200">${t.lot}</td>
            <td class="p-2 font-bold text-amber-400">${t.pair}</td>
            <td class="p-2 text-center text-slate-400">${t.rr}</td>
            <td class="p-2 text-right text-slate-400">${t.risk ? t.risk.toLocaleString('id-ID') : '-'}</td>
            <td class="p-2 text-center">${statusBadge}</td>
            <td class="p-2 text-right font-bold text-emerald-400">${t.profit ? t.profit.toLocaleString('id-ID') : '-'}</td>
            <td class="p-2 text-right font-bold text-rose-400">${t.loss ? t.loss.toLocaleString('id-ID') : '-'}</td>
            <td class="p-2 text-right text-slate-300">${t.pips}</td>
            <td class="p-2 text-slate-300 max-w-xs truncate" title="${t.reason}">${t.reason}</td>
            <td class="p-2 text-slate-400 max-w-xs truncate" title="${t.info}">${t.info}</td>
            <td class="p-2 text-right font-bold text-slate-100">Rp ${t.calculatedEquity.toLocaleString('id-ID')}</td>
            <td class="p-2 text-center">
              ${t.doc ? `<a href="${t.doc}" target="_blank" class="text-blue-400 hover:underline"><i class="fas fa-arrow-up-right-from-square"></i></a>` : '-'}
            </td>
            <td class="p-2 text-center">
              <button onclick="deleteRow(${t.id})" class="text-slate-600 hover:text-rose-400 p-1 transition"><i class="fas fa-trash-can"></i></button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function exportCSV() {
      if (trades.length === 0) return alert('Tidak ada data untuk diekspor!');
      let csv = 'No,Tanggal,Posisi,Lot,Instrumen,RR,Risk,Status,Profit,Loss,Pips,Reason,Information,Equity\n';
      trades.forEach((t, i) => {
        csv += `"${i+1}","${t.date}","${t.side}","${t.lot}","${t.pair}","${t.rr}","${t.risk}","${t.status}","${t.profit}","${t.loss}","${t.pips}","${t.reason}","${t.info}","${t.calculatedEquity}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `jurnal_trading_${Date.now()}.csv`;
      a.click();
    }

    updateCalculations();
    renderSheet();
  </script>
</body>
</html>
